function gcj([lat,lon]){
  const a=6378245,ee=0.00669342162296594323,PI=Math.PI;
  const tl=(x,y)=>{let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;return r};

  dLat=dLat*180/((a*(1-ee))/(m*s)*PI);dLon=dLon*180/(a/s*Math.cos(rad)*PI);
  return [lat+dLat,lon+dLon];
}

const bases={"中文道路圖（高德）":gaode,"街道圖（CARTO）":carto,"衛星圖（Esri）":esri};
const isMobile=matchMedia("(max-width:820px)").matches;
L.control.layers(bases,null,{position:"bottomright",collapsed:isMobile}).addTo(map);
L.control.scale({imperial:false,position:"bottomleft"}).addTo(map);

const markers={},lines=[],zones=[];
const col=c=>C[c];
Object.entries(S).forEach(([k,s])=>{
  const m=L.marker(P(s.p),{icon:L.divIcon({className:"",html:`<div class="pin${s.sq?" sq":""}" style="background:${col(s.c)}">${s.l}</div>`,iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-14]}),title:s.t})
    .bindPopup(`<h4 style="color:${col(s.c)}">${s.t}</h4>${s.i}`);
  m.addTo(map);markers[k]=m;
});
Object.entries(ROUTES).forEach(([d,segs])=>segs.forEach(seg=>{
  const raw=seg.pts.map(pos);
  const style=seg.rail?{color:C.rail,weight:3,dashArray:"2 8",lineCap:"round",opacity:.85}
    :seg.water?{color:C[3],weight:5,dashArray:"10 8",opacity:.9}
    :{color:C[d],weight:4,opacity:.8,dashArray:seg.dash?"6 7":null};
  const pl=L.polyline(raw.map(P),style).addTo(map);
  lines.push({d:+d,pl,raw});
}));
[[[25.90,110.12],"⛰️ 龍脊梯田","Day 2 選項 1・北邊山區"],[[25.36,110.52],"🏙️ 桂林市區","Day 1–2 住宿"],[[24.70,110.66],"🏞️ 陽朔","Day 3–4 住宿"]]
 .forEach(([p,t,s])=>{zones.push({raw:p,m:L.marker(P(p),{interactive:false,icon:L.divIcon({className:"",html:`<div class="zone">${t}<span>${s}</span></div>`,iconSize:[130,40],iconAnchor:[65,20]})}).addTo(map)})});

map.on("baselayerchange",e=>{
  useGcj=e.layer===gaode;
  Object.entries(markers).forEach(([k,m])=>m.setLatLng(P(S[k].p)));
  lines.forEach(o=>o.pl.setLatLngs(o.raw.map(P)));
  zones.forEach(z=>z.m.setLatLng(P(z.raw)));
});

// ---------- 側欄與篩選 ----------
const daysEl=document.getElementById("days");
DAYS.forEach(d=>{
  const el=document.createElement("div");
  el.className="card";el.id="card-"+d.n;el.tabIndex=0;el.style.setProperty("--c",C[d.n]);
  const pill=([k,t])=>`<button class="pill" data-k="${k}">${t}</button>`;
  el.innerHTML=`<h2>${d.title}<small>${d.tag}</small></h2><div class="where">${d.where}</div><div class="desc">${d.desc}</div>`
    +(d.pills?`<div class="pills">${d.pills.map(pill).join("")}</div>`:"")
    +(d.opts||[]).map(([o,ps])=>`<div class="opt">${o}</div><div class="pills">${ps.map(pill).join("")}</div>`).join("")
    +`<div class="hotel">${d.hotel}</div>`;
  el.addEventListener("click",e=>{const b=e.target.closest(".pill");if(b){focusSpot(b.dataset.k,d.n);return}select(d.n)});
  el.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target===el)select(d.n)});
  daysEl.appendChild(el);
});
const bar=document.getElementById("bar");
[[0,"🗺️ 桂林全覽"],["trip","🚄 含高鐵進出"],...DAYS.map(d=>[d.n,"Day "+d.n])].forEach(([v,t])=>{
  const b=document.createElement("button");b.dataset.v=v;
  b.innerHTML=(typeof v==="number"&&v>0?`<span class="d" style="--c:${C[v]}"></span>`:"")+t;
  b.onclick=()=>select(v);bar.appendChild(b);
});

function fit(v){const [a,b]=VIEWS[v];map.flyToBounds([P(a),P(b)],{duration:.8,padding:isMobile?[16,16]:[30,30],paddingTopLeft:isMobile?[16,56]:[30,60]})}
function select(v){
  const day=typeof v==="number"&&v>0?v:0;
  bar.querySelectorAll("button").forEach(b=>b.classList.toggle("on",String(b.dataset.v)===String(v)));
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("on",c.id==="card-"+day));
  if(day) document.getElementById("card-"+day).scrollIntoView({behavior:"smooth",block:"nearest"});
  Object.entries(markers).forEach(([k,m])=>{const show=!day||S[k].d.includes(day);show?m.addTo(map):m.remove()});
  lines.forEach(o=>(!day||o.d===day)?o.pl.addTo(map):o.pl.remove());
  zones.forEach(z=>day?z.m.remove():z.m.addTo(map));
  map.closePopup();fit(v);
}
function focusSpot(k,day){
  select(day);
  setTimeout(()=>{map.flyTo(P(S[k].p),Math.max(map.getZoom(),13),{duration:.7});setTimeout(()=>markers[k].openPopup(),750)},850);
}
map.fitBounds(VIEWS[0].map(P));
select(0);
</script>
</body>
</html>
